site_name: Pydontology
site_url: https://brandurjacobsen.github.io/pydontology
repo_url: https://github.com/brandurjacobsen/pydontology
edit_uri: edit/main/mkdocs/

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            extensions:
              - griffe_pydantic:
                  schema: true

nav:
  - Home: index.md
  - Reference: reference.md

theme: darkly

markdown_extensions:
  - toc:
      permalink: "#"

docs_dir: mkdocs
site_dir: _site
