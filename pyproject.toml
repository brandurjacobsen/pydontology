
[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pydontology"
version = "2026.11.18"
dependencies = ["pydantic>=2.12"]
requires-python = ">=3.11"
authors = [
  {name = "Brandur K. Jacobse", email = "brandurjacobsen@gmail.com"}
]
maintainers = [
  {name = "Brandur K. Jacobsen", email = "brandurjacobsen@gmail.com"}
]
description = "A package for constructing ontologies and JSON-LD schemas using Pydantic model classes"
readme = "README.md"
license = "MIT"

keywords = ["Pydantic", "Ontology", "RDF", "RDFS", "OWL", "SHACL", "JSON-LD", ]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python"
]

[project.optional-dependencies]
examples = ["marimo", "rdflib", "pyshacl"]
tests = ["pytest", "rdflib", "pyshacl", "jinja2"]

[tool.setuptools]
packages = ["pydontology"]
py-modules = ["__init__"]

[tool.setuptools.package-data]
pydontology = ["py.typed"]

[tool.pytest.ini_options]
markers = ["settings"]
